<style>
:root{
  --bg:#0d1026; --bg2:#171b3d; --card:#1d2250; --line:#2f3570;
  --gold:#f5c451; --gold2:#ffe39a; --text:#f4f1ff; --muted:#a9acd6;

  --body:"Gowun Dodum",system-ui,sans-serif; --head:Jua,sans-serif;
}
html[lang=en]{--body:Fredoka,system-ui,sans-serif;--head:Fredoka,sans-serif}
html[lang=ja]{--body:"M PLUS Rounded 1c",system-ui,sans-serif;--head:"M PLUS Rounded 1c",sans-serif}
html[lang=zh]{--body:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;--head:"ZCOOL KuaiLe",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#2a2f6e 0%,var(--bg) 60%) fixed,var(--bg);
  color:var(--text);font-family:var(--body);min-height:100vh;overflow-x:hidden}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:24px 16px 80px}
.top{display:flex;justify-content:flex-end}
.langs{display:flex;gap:4px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:4px}
.langs button{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
.langs button.on{background:var(--gold);color:var(--bg)}
header{text-align:center;margin-top:16px}
.kicker{color:var(--gold);letter-spacing:.3em;font-size:13px;font-family:Fredoka,sans-serif}
h1{font-family:var(--head);font-size:clamp(34px,6vw,58px);margin:10px 0 8px;font-weight:800;
  background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
html[lang=ko] h1{font-weight:400}
.sub{color:var(--muted);max-width:600px;margin:0 auto;line-height:1.75}
.hero{display:flex;flex-direction:column;align-items:center;margin:20px 0 4px}
.heroEgg{position:relative;width:min(220px,50vw);border:0;background:none;padding:0;cursor:pointer;animation:bob 3.2s ease-in-out infinite;
  -webkit-tap-highlight-color:transparent}
.heroEgg:focus-visible{outline:2px dashed var(--gold);outline-offset:8px;border-radius:40%}
.heroEgg .shake{position:relative;transform-origin:50% 90%}
.heroEgg.knock .shake{animation:knock .6s ease-in-out}
.heroEgg img{display:block;width:100%;filter:drop-shadow(0 18px var(--gl,30px) rgba(245,196,81,var(--ga,.25)))}
.heroEgg svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.crack .gl{stroke:#ffd76a;stroke-width:9;opacity:var(--cg,.4);filter:blur(3px)}
.crack .ln{stroke:#5b3a10;stroke-width:3}
.crack path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.spark{position:absolute;left:50%;top:45%;width:6px;height:6px;border-radius:50%;background:var(--gold2);
  box-shadow:0 0 8px var(--gold);pointer-events:none;animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes knock{15%{transform:rotate(-7deg)}35%{transform:rotate(6deg)}55%{transform:rotate(-4deg)}75%{transform:rotate(2deg)}100%{transform:none}}
.whisper{min-height:22px;margin-top:10px;font-size:14px;color:var(--gold2);opacity:0;transition:opacity .4s}
.whisper.on{opacity:1}
.hint{font-size:12px;color:var(--muted)}
.tapc path{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke-dashoffset .22s ease-out}
.tapc .gl{stroke:#ffd76a;stroke-width:9;opacity:.55;filter:blur(2.5px)}
.tapc .ln{stroke:#5b3a10;stroke-width:3.4}
.tapc{transition:opacity .9s}
.tapc.fade{opacity:0}
.chip{position:absolute;width:7px;height:6px;background:#fbf3e4;border:1px solid #c9b48f;pointer-events:none;
  clip-path:polygon(0 30%,45% 0,100% 25%,80% 100%,15% 85%);animation:chip .9s cubic-bezier(.3,.1,.7,1) forwards}
@keyframes chip{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.hintRow{display:flex;align-items:center;gap:8px;margin-top:2px}
.snd{font:inherit;font-size:14px;line-height:1;background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:4px 9px;cursor:pointer}
.snd:hover{border-color:var(--gold);color:var(--gold2)}

.prog{width:min(320px,80vw);margin:10px auto 0}
.prog .bar{height:6px;border-radius:99px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px}
.prog p{margin:6px 0 0;font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.heroEgg,.heroEgg.knock .shake,.spark,.chip{animation:none!important}.chip{display:none}}
.countdown{display:flex;justify-content:center;gap:10px;margin:18px 0 8px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:78px;padding:12px 8px;text-align:center}
.cd b{display:block;font-family:Fredoka,sans-serif;font-size:34px;font-weight:600;color:var(--gold2)}
.cd span{font-size:12px;color:var(--muted)}
.hatchdate{text-align:center;color:var(--muted);font-size:14px}
.hatchdate.done{color:var(--gold2)}
/* 소개 */
.about{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:44px 0 10px}
.about article{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:22px}
.about h3{font-family:var(--head);font-weight:600;color:var(--gold2);margin:0 0 10px;font-size:20px}
html[lang=ko] .about h3{font-weight:400}
.about p{margin:0;line-height:1.75;color:#dcdaf5;font-size:15px}
.about .ic{font-size:26px}
.wl{margin:18px 0 0;background:linear-gradient(135deg,#2a2460,#1b1f4a);border:1px solid var(--gold);border-radius:20px;padding:26px 24px;
  display:grid;grid-template-columns:1.2fr 1fr;gap:22px;align-items:center}
.wl h3{font-family:var(--head);color:var(--gold2);font-size:24px;margin:0 0 6px;font-weight:600}
html[lang=ko] .wl h3{font-weight:400}
.wl .big{font-family:Fredoka,sans-serif;font-size:44px;font-weight:600;color:var(--gold2);line-height:1}
.wl .big small{font-size:15px;color:var(--muted);font-weight:500;margin-left:6px}
.wl ol{margin:12px 0 0;padding-left:20px;line-height:1.8;color:#dcdaf5;font-size:15px}
.wl .note{font-size:13px;color:var(--muted);margin:12px 0 0;line-height:1.6}
.wl .btns{display:flex;flex-direction:column;gap:10px}
.wl a.btn{display:block;text-align:center;text-decoration:none;font-weight:600;border-radius:14px;padding:14px 16px;font-size:16px}
.wl a.x{background:var(--gold);color:var(--bg)} .wl a.x:hover{background:var(--gold2)}
.wl a.f{border:1px solid var(--gold);color:var(--gold2)} .wl a.f:hover{background:rgba(245,196,81,.1)}
.wl .mint{font-size:13px;color:var(--gold2);text-align:center;margin-top:4px}
@media (max-width:760px){.wl{grid-template-columns:1fr}}
.tl{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px;margin:18px auto 0;max-width:640px}
.tl span{font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
.tl span.now{border-color:var(--gold);color:var(--gold2)}
.tl span.hatch{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600}
.tl i{color:var(--muted);font-style:normal;opacity:.7}
.tlnote{text-align:center;font-size:12px;color:var(--muted);margin:8px 0 0}
h2.sec{font-family:var(--head);font-weight:600;text-align:center;color:var(--gold2);margin:48px 0 18px;font-size:26px}
html[lang=ko] h2.sec{font-weight:400}
/* 격자 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.egg{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
  border-radius:16px;padding:10px 8px;cursor:pointer;text-align:center;transition:transform .2s,border-color .2s;font:inherit;color:inherit}
.egg:hover,.egg:focus-visible{transform:translateY(-4px);border-color:var(--gold);outline:none}
.egg img{width:78%;aspect-ratio:3/4;object-fit:contain;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 6px 12px rgba(0,0,0,.45))}
.egg .no{font-family:Fredoka,sans-serif;font-weight:600;font-size:17px;color:var(--gold2);margin-top:4px}
.egg.hatched img{animation:wobble .5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes wobble{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){img{animation:none!important}}
/* 팝업 */
dialog{border:1px solid var(--line);border-radius:22px;background:var(--bg2);color:var(--text);max-width:760px;width:calc(100% - 32px);padding:0}
dialog::backdrop{background:rgba(5,6,20,.75);backdrop-filter:blur(4px)}
.d{display:grid;grid-template-columns:1fr 1fr}
.d .pic{background:radial-gradient(circle at 50% 45%,#3a3f8a,var(--bg) 70%);padding:30px 40px;display:flex;align-items:center;justify-content:center}
.d .pic img{width:100%;max-width:260px;animation:bob 3.2s ease-in-out infinite}
.d .info{padding:26px 24px}
.d h2{font-family:var(--head);font-weight:600;font-size:30px;margin:4px 0 8px;color:var(--gold2)}
html[lang=ko] .d h2{font-weight:400}
.d .story{line-height:1.8;color:#dcdaf5;margin:0}
.d dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:18px 0;font-size:14px}
.d dt{color:var(--muted)} .d dd{margin:0}
.d .art{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;line-height:1.7}
.close{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--muted);font-size:26px;cursor:pointer;z-index:2}
.navs{display:flex;gap:8px;margin-top:16px}
.navs button{flex:1;font:inherit;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer}
@media (max-width:760px){.about{grid-template-columns:1fr}}
@media (max-width:640px){.d{grid-template-columns:1fr}.d .pic{padding:20px 80px}.grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
  .cd{min-width:64px}.cd b{font-size:26px}.langs button{padding:6px 9px}}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:50px;line-height:1.7}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<main>
  <div class="top"><nav class="langs" id="langs" aria-label="Language"></nav></div>

  <section class="about">

  <h2 class="sec" data-t="grid"></h2>

  <footer data-t="foot"></footer>
</main>

<dialog id="dlg"><button class="close" id="x" aria-label="close">×</button><div class="d" id="dc"></div></dialog>

const ORDER=['en','ko','ja','zh'];

// 언어 정하기: ?lang= → 저장된 값 → 브라우저 언어
function pickLang(){
  const q=new URLSearchParams(location.search).get('lang'); if(T[q])return q;
  try{const s=localStorage.getItem('c100lang'); if(T[s])return s}catch(e){}
  const n=(navigator.language||'en').slice(0,2); return T[n]?n:'en';
}
let L=pickLang();
const pad=n=>String(n).padStart(3,'0');
const isHatched=()=>Date.now()>=HATCH_AT;
const fmtDate=()=>HATCH_AT.toLocaleString(T[L].loc,{timeZone:'Asia/Seoul',dateStyle:'long',timeStyle:'short'});

const langs=document.getElementById('langs');
ORDER.forEach(k=>{const b=document.createElement('button');b.textContent=T[k].name;b.dataset.k=k;
  b.onclick=()=>setLang(k);langs.appendChild(b)});

function setLang(k){
  L=k; const t=T[k];
  try{localStorage.setItem('c100lang',k)}catch(e){}
  const u=new URL(location.href); u.searchParams.set('lang',k); history.replaceState(null,'',u);
  document.documentElement.lang=k;
  document.title=t.title+' · The Chosen 100';
  langs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  document.querySelectorAll('[data-t]').forEach(el=>el.innerHTML=t[el.dataset.t]);
  updateDate(); render(); if(dlg.open) open(cur); if(typeof growEgg==='function') growEgg(); if(typeof setXLink==='function') setXLink(); if(typeof paintTL==='function') paintTL();
}

const grid=document.getElementById('grid');
function render(){
  const t=T[L], h=isHatched(); grid.innerHTML='';
  for(let n=1;n<=100;n++){
    const b=document.createElement('button'); b.className='egg'+(h?' hatched':'');
    b.innerHTML=`<img src="${EGG_IMG}" alt="${t.alt(n)}" loading="lazy" style="animation-delay:${-(n%9)*.35}s"><div class="no">#${pad(n)}</div>`;
    b.onclick=()=>open(n); grid.appendChild(b);
  }
}

const dlg=document.getElementById('dlg'), dc=document.getElementById('dc'); let cur=1;
function open(n){
  cur=n; const t=T[L], h=isHatched();
  dc.innerHTML=`<div class="pic"><img src="${EGG_IMG}" alt="${t.alt(n)}"></div>
  <div class="info">
    <div class="kicker">NO. ${pad(n)} / 100</div>
    <h2>${t.egg} #${pad(n)}</h2>
    <p class="story">${h?t.storyH:t.story}</p>
    <dl>
      <dt>${t.no}</dt><dd>${n} / 100</dd>
      <dt>${t.status}</dt><dd>${h?t.hatching:t.waiting}</dd>
      <dt>${t.inside}</dt><dd>${t.unknown}</dd>
      <dt>${t.hatchLabel}</dt><dd>${fmtDate()} ${t.tz}</dd>
    </dl>
    <div class="art">${t.what(n)}</div>
    <div class="navs"><button id="pv">${t.prev}</button><button id="nx">${t.next}</button></div>
  </div>`;
  dc.querySelector('#pv').onclick=()=>open(cur===1?100:cur-1);
  dc.querySelector('#nx').onclick=()=>open(cur===100?1:cur+1);
  if(!dlg.open) dlg.showModal();
  history.replaceState(null,'',location.search+'#'+n);
}
document.getElementById('x').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
dlg.addEventListener('close',()=>history.replaceState(null,'',location.pathname+location.search));
document.addEventListener('keydown',e=>{if(!dlg.open)return;
  if(e.key==='ArrowRight')open(cur===100?1:cur+1); if(e.key==='ArrowLeft')open(cur===1?100:cur-1)});

// 카운트다운
const two=n=>String(n).padStart(2,'0'); const hd=document.getElementById('hd');
let wasHatched=isHatched();
function updateDate(){ if(isHatched()){hd.textContent=T[L].hatched;hd.classList.add('done')}
  else hd.textContent=`${T[L].hatchLabel} · ${fmtDate()} ${T[L].tz}`; }
function tick(){
  const left=Math.max(0,HATCH_AT-Date.now()), s=Math.floor(left/1000);
  dd.textContent=Math.floor(s/86400); hh.textContent=two(Math.floor(s%86400/3600));
  mm.textContent=two(Math.floor(s%3600/60)); ss.textContent=two(s%60);
  if(!left&&!wasHatched){wasHatched=true;updateDate();render()}
}

// 살아 있는 알: 부화일이 다가올수록 금과 빛이 커져요

function setXLink(){const u='https://x.com/intent/post?text='+encodeURIComponent(T[L].xtext)+'&hashtags=TheChosen100&url='+encodeURIComponent('https://ssgkgk1-sketch.github.io/the-chosen-100/');
  const a=document.getElementById('xPost'); if(a) a.href=u;}

function paintTL(){const el=document.getElementById('tl'); if(!el) return;
  el.innerHTML=T[L].tl.map((x,i)=>`<span class="${i===0?'now':i===3?'hatch':''}">${x}</span>`).join('<i>→</i>');}
const START_AT=new Date('2026-11-02T00:00:00+09:00');
const heroEgg=document.getElementById('heroEgg'), cracks=[...document.querySelectorAll('#cracks .crack')];
const clamp=v=>Math.max(0,Math.min(1,v));
function growEgg(){
  const p=clamp((Date.now()-START_AT)/(HATCH_AT-START_AT));
  cracks.forEach((g,i)=>{const f=i===0?Math.max(.18,clamp(p/.3)):clamp((p-i*.22)/.3);
    g.style.display=f?'':'none'; g.querySelectorAll('path').forEach(el=>{el.style.strokeDasharray=1;el.style.strokeDashoffset=1-f});
    g.style.setProperty('--cg',(.3+.7*p).toFixed(2))});
  heroEgg.style.setProperty('--ga',(.25+.5*p).toFixed(2)); heroEgg.style.setProperty('--gl',(30+40*p)+'px');
  const n=Math.floor(p*100); pbar.style.width=Math.max(1,n)+'%'; ptxt.textContent=T[L].prog(n);
}
let wi=0, wt;
heroEgg.addEventListener('click',()=>{
  heroEgg.classList.remove('knock'); void heroEgg.offsetWidth; heroEgg.classList.add('knock');
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches) for(let k=0;k<7;k++){const sp=document.createElement('span');sp.className='spark';
    const a=Math.random()*Math.PI*2, r=50+Math.random()*50; sp.style.setProperty('--dx',Math.cos(a)*r+'px'); sp.style.setProperty('--dy',Math.sin(a)*r-20+'px');
    heroEgg.appendChild(sp); setTimeout(()=>sp.remove(),900)}
  const w=document.getElementById('whisper'); w.textContent=T[L].wh[wi++%T[L].wh.length]; w.classList.add('on');
  clearTimeout(wt); wt=setTimeout(()=>w.classList.remove('on'),2600);
});

// 두드리는 소리: 파일 없이 브라우저에서 합성
let AC=null, soundOn=true;
try{soundOn=localStorage.getItem('c100sound')!=='off'}catch(e){}
const sndBtn=document.getElementById('snd');
function paintSnd(){sndBtn.textContent=soundOn?'🔊':'🔇'; sndBtn.setAttribute('aria-label',soundOn?'Sound on':'Sound off')}
sndBtn.addEventListener('click',()=>{soundOn=!soundOn; try{localStorage.setItem('c100sound',soundOn?'on':'off')}catch(e){} paintSnd()});
paintSnd();
function crackSound(){
  if(!soundOn) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
    const t=AC.currentTime, out=AC.createGain(); out.gain.value=.55; out.connect(AC.destination);
    // 톡: 짧고 낮은 두드림
    const o=AC.createOscillator(), g=AC.createGain(); o.type='sine';
    o.frequency.setValueAtTime(240+Math.random()*40,t); o.frequency.exponentialRampToValueAtTime(95,t+.08);
    g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.001,t+.13); o.connect(g).connect(out); o.start(t); o.stop(t+.14);
    // 쩍: 껍데기 갈라지는 잡음 2~3번
    const n=2+Math.floor(Math.random()*2);
    for(let i=0;i<n;i++){
      const len=Math.floor(AC.sampleRate*.045), buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
      for(let k=0;k<len;k++) d[k]=(Math.random()*2-1)*Math.pow(1-k/len,3);
      const src=AC.createBufferSource(); src.buffer=buf;
      const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2200+Math.random()*2600; bp.Q.value=1.2;
      const ng=AC.createGain(); ng.gain.value=.9-i*.25;
      src.connect(bp).connect(ng).connect(out); src.start(t+.025+i*(.02+Math.random()*.03));
    }
  }catch(e){}
}
// 두드릴 때마다 껍데기에 작은 금 + 조각
const SPOTS=[[80,170],[70,240],[95,300],[400,170],[410,240],[385,300],[200,28],[270,24],[170,350],[300,352],[235,365]];
const tapLayer=document.getElementById('tapCracks'), NS='http://www.w3.org/2000/svg';
function tapCrack(){
  const [x0,y0]=SPOTS[Math.floor(Math.random()*SPOTS.length)];
  let x=x0,y=y0,dir=Math.random()<.5?-1:1, d=`M${x} ${y}`;
  const segs=3+Math.floor(Math.random()*2);
  for(let i=0;i<segs;i++){ x+=dir*(9+Math.random()*12); y+=12+Math.random()*12; dir*=-1; d+=` L${x.toFixed(0)} ${y.toFixed(0)}`; }
  const g=document.createElementNS(NS,'g'); g.setAttribute('class','tapc');
  ['gl','ln'].forEach(c=>{const pth=document.createElementNS(NS,'path'); pth.setAttribute('class',c); pth.setAttribute('d',d);
    pth.setAttribute('pathLength','1'); pth.style.strokeDasharray=1; pth.style.strokeDashoffset=1; g.appendChild(pth)});
  tapLayer.appendChild(g);
  requestAnimationFrame(()=>requestAnimationFrame(()=>g.querySelectorAll('path').forEach(pth=>pth.style.strokeDashoffset=0)));
  while(tapLayer.children.length>6) tapLayer.firstChild.remove();
  setTimeout(()=>g.classList.add('fade'),2200); setTimeout(()=>g.remove(),3200);
  // 조각
  const box=heroEgg.querySelector('.shake');
  for(let k=0;k<4+Math.floor(Math.random()*3);k++){
    const c=document.createElement('span'); c.className='chip';
    c.style.left=(x0/479*100)+'%'; c.style.top=(y0/640*100)+'%';
    c.style.setProperty('--dx',(Math.random()*60-30)+'px'); c.style.setProperty('--dy',(40+Math.random()*60)+'px');
    c.style.setProperty('--r',(Math.random()*540-270)+'deg'); c.style.animationDelay=(Math.random()*.08)+'s';
    box.appendChild(c); setTimeout(()=>c.remove(),1100);
  }
}
heroEgg.addEventListener('click',()=>{crackSound(); tapCrack(); if(navigator.vibrate) try{navigator.vibrate(12)}catch(e){}});
heroEgg.setAttribute('aria-label','The Chosen 100 egg');
growEgg(); setInterval(growEgg,60000); setXLink();
setLang(L); tick(); setInterval(tick,1000);
const h0=parseInt(location.hash.slice(1)); if(h0>=1&&h0<=100) open(h0);

// 별 배경
const c=document.getElementById('stars'), x=c.getContext('2d'); let st=[];
function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;
  st=Array.from({length:140},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.4+.3,p:Math.random()*6}))}
size(); addEventListener('resize',size);
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
(function draw(t){x.clearRect(0,0,c.width,c.height);
  for(const s of st){x.globalAlpha=.35+.65*Math.abs(Math.sin(s.p+(still?0:t/1400)));x.fillStyle='#fff';
    x.beginPath();x.arc(s.x,s.y,s.r*devicePixelRatio,0,7);x.fill()}
  if(!still)requestAnimationFrame(draw)})(0);
</script>
